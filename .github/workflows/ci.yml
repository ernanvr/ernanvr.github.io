name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔧 Setup Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      # Temporarily non-blocking: the registry's bulk advisory endpoint returns a
      # gzip body without a content-encoding header, so npm falls back to the
      # retired quick-audit endpoint and always exits 1. See issue #61 and make
      # this step blocking again once the registry is fixed.
      - name: "🔒 Security audit"
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: "🔎 Lint code"
        run: npm run lint

      - name: "📝 Checking code format"
        run: npm run format:check

      - name: "🚀 Build the project"
        run: npm run build
